name: large-feature
description: Plan a larger change as ordered phases, build each phase as a child ticket, then prove and land the whole.
steps:
  - id: plan
    kind: agent
    role: planner
    instructions: Break the work into ordered phases, each with its own acceptance scenarios.

  - id: approve-plan
    kind: human
    routes:
      changes-needed: plan

  - id: split
    kind: system
    action: split
    with:
      workflow: phase

  - id: wait
    kind: system
    action: wait-children

  - id: final-test
    kind: agent
    role: tester
    needs: [verify]
    instructions: Test the whole change against the whole plan, not one phase.
    limit: 2
    routes:
      passed: maintain-pr
      changes-needed: final-fix
      limit: maintain-pr

  - id: final-fix
    kind: agent
    role: builder
    routes:
      done: final-test

  - id: maintain-pr
    kind: system
    action: maintain-pr
    routes:
      conflict: final-fix
      ci-failed: final-fix
      base-moved: final-test

  - id: merge
    kind: system
    action: merge
    routes:
      changes-needed: final-fix
