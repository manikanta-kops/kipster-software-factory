name: lead
description: A lead agent splits the ticket into tasks that run as child tickets, then the whole change is tested, reviewed and landed.
steps:
  - id: lead
    kind: agent
    role: lead
    routes:
      plan-ready: approve-plan
      delegate: run-tasks
      done: final-test

  - id: approve-plan
    kind: human
    routes:
      approved: lead
      changes-needed: lead

  - id: run-tasks
    kind: system
    action: run-tasks
    with:
      maxParallel: 3
      maxTasks: 20
    limit: 50
    routes:
      reported: lead

  - id: final-test
    kind: agent
    role: tester
    instructions: Test the whole change against the ticket and the approved plan, not one task.
    limit: 3
    routes:
      changes-needed: lead

  - id: review
    kind: agent
    role: reviewer
    limit: 5
    routes:
      changes-needed: lead
      limit: maintain-pr

  - id: maintain-pr
    kind: system
    action: maintain-pr
    limit: 3
    routes:
      conflict: lead
      ci-failed: lead
      base-moved: final-test

  - id: merge
    kind: system
    action: merge
    routes:
      changes-needed: lead
