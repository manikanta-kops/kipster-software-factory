name: bug
description: Reproduce the bug first, fix it, prove the fix in the running app and land it.
steps:
  - id: reproduce
    kind: agent
    role: reproducer
    needs: [verify]

  - id: fix
    kind: agent
    role: builder

  - id: test
    kind: agent
    role: tester
    needs: [verify]
    instructions: Show the reproduction failing on the base branch and passing on this branch.
    limit: 3
    routes:
      changes-needed: fix

  - id: review
    kind: agent
    role: reviewer
    limit: 2
    routes:
      changes-needed: fix

  - id: maintain-pr
    kind: system
    action: maintain-pr
    routes:
      conflict: fix
      ci-failed: fix
      base-moved: test

  - id: merge
    kind: system
    action: merge
    routes:
      changes-needed: fix
