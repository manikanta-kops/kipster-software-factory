name: onboard-repo
description: Write a repository's .kipster kit, prove it works end to end, and land it after your review.
steps:
  - id: write-kit
    kind: agent
    role: onboarder

  - id: approve-kit
    kind: human
    routes:
      changes-needed: write-kit

  - id: maintain-pr
    kind: system
    action: maintain-pr
    routes:
      conflict: write-kit
      ci-failed: write-kit

  - id: merge
    kind: system
    action: merge
    routes:
      changes-needed: write-kit
