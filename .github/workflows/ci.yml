name: CI

on:
  pull_request:
    branches: [next, master]
  push:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Built-in workflows are valid
        run: npm run kf -- check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL 18
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Decision acceptance screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: decision-acceptance
          path: |
            test-results/decisions-*/confirm-band.png
            test-results/decisions-*/decisions-page.png
          if-no-files-found: ignore
          retention-days: 7
