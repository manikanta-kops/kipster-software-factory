name: Bug
description: Something that should work does not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps, workflow file or ticket that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
